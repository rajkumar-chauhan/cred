kafka-exporter:
  image:
    tag: "v1.9.0"

  replicaCount: 1

  kafkaServer:
    - kafka.otel-demo.svc.cluster.local:9092

  sasl:
    enabled: false
      # handshake: true
      # scram:
      #enabled: true
      #mechanism: plain
      #username: kafkaadmin
      #password: kafkaadmin@123

  verbosity: 0

  service:
    type: ClusterIP
    port: 9308
    annotations: {}
    labels:
      app.kubernetes.io/name: kafka
      app.kubernetes.io/component: kafka

  resources:
    limits:
      cpu: 250m
      memory: 192Mi
    requests:
      cpu: 100m
      memory: 128Mi

  prometheus:
    serviceMonitor:
      enabled: true
      namespace: monitoring
      interval: "30s"
      scrapeTimeout: "10s"
      targetLabels:
        - app.kubernetes.io/name
        - app.kubernetes.io/component
      metricRelabelings:
        - sourceLabels: [pod]
          targetLabel: instance
          action: replace
